<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>FLUXO DE PROCESSO — Liberação de Atividades — 360° Park View</title>
<style>
:root{--green:#16a34a;--blue:#2563eb;--red:#dc2626;--black:#111827;--navy:#004a67;--navy2:#00658b;--bg:#eef3f6;--card:#fff;--text:#17212b;--muted:#687786;--border:#dbe4ea;--shadow:0 8px 24px rgba(15,45,60,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#e8f0f4 0,#f6f8fa 300px);font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
header{position:relative;background:linear-gradient(125deg,var(--navy),var(--navy2));color:white;padding:18px 18px 20px;box-shadow:0 6px 24px rgba(0,74,103,.22);overflow:hidden}header:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-155px;background:rgba(255,255,255,.08)}.head{position:relative;z-index:1;max-width:1120px;margin:auto;display:flex;align-items:center;gap:18px}.logo-box{background:white;border-radius:16px;padding:9px 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 16px rgba(0,0,0,.12)}.cury-logo{width:138px;max-height:54px;object-fit:contain;display:block}header h1{margin:0;font-size:25px;line-height:1.05;letter-spacing:.055em;font-weight:900}header p{margin:4px 0 0;font-size:12px;opacity:.88}
.wrap{max-width:1120px;margin:auto;padding:18px 16px 28px}.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}.save-btn{margin-left:auto;border:0;border-radius:999px;padding:7px 14px;background:#6b7280;color:#fff;font-size:10px;font-weight:950;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.12)}.save-btn:hover{background:#4b5563}.data-btn{border:0;border-radius:999px;padding:7px 12px;color:#fff;font-size:10px;font-weight:950;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.12)}.export-btn{background:#2563eb}.export-btn:hover{background:#1d4ed8}.import-btn{background:#0f766e}.import-btn:hover{background:#115e59}.pill{border:1px solid transparent;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:900;background:white;box-shadow:0 2px 7px rgba(15,45,60,.05)}.g{color:var(--green);border-color:#bbf7d0}.b{color:var(--blue);border-color:#bfdbfe}.r{color:var(--red);border-color:#fecaca}.k{color:var(--black);border-color:#d1d5db}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:rgba(255,255,255,.96);border:1px solid rgba(219,228,234,.9);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}.lab{font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#536473}.sel{display:block;width:100%;height:45px;margin-top:6px;border:1px solid var(--border);border-radius:11px;padding:7px 11px;background:#f9fbfc;font-size:14px;font-weight:700;color:var(--text);outline:none;transition:.2s}.sel:focus{border-color:#4aa4c6;box-shadow:0 0 0 3px rgba(0,101,139,.11);background:white}
.summary{background:white;border:1px solid var(--border);border-radius:16px;padding:13px 15px;font-weight:800;font-size:13px;margin-bottom:13px;box-shadow:0 4px 15px rgba(15,45,60,.05)}.phase{display:flex;align-items:center;gap:9px;margin:20px 0 9px;color:#526675;font-size:10px;font-weight:950;letter-spacing:.09em;text-transform:uppercase}.phase:before{content:"";width:6px;height:20px;border-radius:99px;background:linear-gradient(var(--navy2),var(--navy))}.phase:after{content:"";height:1px;background:#dce5ea;flex:1}
.task{position:relative;border:1px solid;border-left-width:5px;border-radius:15px;padding:11px 12px;margin-bottom:9px;box-shadow:0 3px 12px rgba(15,45,60,.045);transition:transform .15s,box-shadow .15s}.task:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(15,45,60,.08)}.fin{border-color:#86d6a2;background:linear-gradient(90deg,#f0fdf4,#fff)}.lib{border-color:#8db8ff;background:linear-gradient(90deg,#eff6ff,#fff)}.bloq{border-color:#f0a0a0;background:linear-gradient(90deg,#fff1f2,#fff)}.force{border-color:#111827;background:linear-gradient(115deg,#111827,#273344);color:white}
.row{display:flex;align-items:center;gap:10px}.content{flex:1;min-width:0}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;color:white;font-size:8px;letter-spacing:.055em;font-weight:950}.fin .badge{background:var(--green)}.lib .badge{background:var(--blue)}.bloq .badge{background:var(--red)}.force .badge{background:white;color:var(--black)}.name{font-size:14px;font-weight:800;margin-top:5px;line-height:1.25}.dep{font-size:10px;color:#6b7884;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.force .dep{color:#dbe3e8}.right{flex:none;display:flex;align-items:center;gap:7px}.fvsbox{width:72px}.fvslab{display:block;text-align:center;font-size:7px;letter-spacing:.05em;font-weight:950;color:#667581;margin-bottom:3px}.force .fvslab{color:#e8edf0}.fvs{width:72px;height:36px;border:1px solid #cbd6dc;border-radius:9px;background:white;color:#111827;text-align:center;font-size:15px;font-weight:850;padding:3px;outline:none;transition:.2s}.fvs:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}.final{height:36px;border:0;border-radius:9px;padding:5px 11px;color:white;font-size:9px;letter-spacing:.025em;font-weight:950;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:.15s}.final:hover,.qf:hover{filter:brightness(.96);transform:translateY(-1px)}.lib .final{background:var(--blue)}.fin .final{background:var(--green)}.force .final{background:white;color:var(--black)}.qf{width:34px;height:34px;border:0;border-radius:9px;background:#111827;color:white;font-weight:900;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:.15s}.force .qf{background:white;color:var(--black)}.pending{margin-top:6px;display:flex;align-items:center;gap:7px}.pending-label{display:block;flex:none;font-size:8px;letter-spacing:.055em;font-weight:950;color:#667581;margin-bottom:0}.pending-input{width:100%;height:30px;min-height:30px;border:1px solid #cbd6dc;border-radius:8px;background:white;color:#111827;padding:5px 8px;font:inherit;font-size:11px;line-height:18px;outline:none;resize:none;transition:.2s}.pending-input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.13)}.pending-input:not(:placeholder-shown){border-color:#f59e0b;background:#fffbeb}.force .pending-label{color:#e8edf0}.notice{display:none;position:sticky;top:8px;z-index:5;margin-bottom:10px;border-radius:12px;padding:11px 13px;background:#111827;color:white;font-size:12px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.18)}.notice.show{display:block}.footer{padding:22px 0 8px;text-align:center;font-size:10px;color:#82909a}
@media(max-width:720px){header{padding:14px 12px 16px}.head{gap:11px}.logo-box{padding:7px 9px;border-radius:12px}.cury-logo{width:105px}header h1{font-size:18px}header p{font-size:10px}.wrap{padding:12px 9px 24px}.filters{grid-template-columns:1fr 1fr;padding:11px;gap:9px;border-radius:14px}.sel{height:43px;font-size:13px}.task{padding:9px 9px;border-radius:12px}.name{font-size:12px}.dep{display:none}.fvsbox,.fvs{width:58px}.fvs{height:34px;font-size:14px}.final{height:34px;padding:4px 7px;font-size:8px}.qf{width:32px;height:32px}.right{gap:4px}.badge{font-size:7px}.phase{margin-top:16px}.legend{gap:5px}.pill{font-size:8px;padding:5px 7px}}
@media(max-width:430px){.filters{grid-template-columns:1fr 1fr}.row{gap:5px}.fvsbox,.fvs{width:54px}.final{padding:4px 6px}.name{font-size:11.5px}}
</style>
</head>

const area=document.getElementById('area'),tower=document.getElementById('tower'),floor=document.getElementById('floor'),apt=document.getElementById('apt'),aptLabel=document.getElementById('aptLabel');

async function saveCloud(silent=true){
  if(cloudSaving){ clearTimeout(cloudTimer); cloudTimer=setTimeout(()=>saveCloud(silent),500); return; }
  cloudSaving=true;
  try{
    const res=await fetch('/.netlify/functions/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({states,updatedAt:new Date().toISOString()})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    if(!silent) renderNotice('✓ DADOS SALVOS NO NETLIFY');
  }catch(e){
    console.error(e);
    if(!silent) renderNotice('⚠ SALVO NESTE APARELHO, MAS FALHOU O ENVIO AO NETLIFY');
  }finally{ cloudSaving=false; }
}
function scheduleCloudSave(){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>saveCloud(true),650)}
function save(){localStorage.setItem(STORAGE,JSON.stringify(states));scheduleCloudSave();showSaved()}
let saveTimer; function showSaved(){clearTimeout(saveTimer); const n=document.getElementById('notice'); n.textContent='✓ DADOS SALVOS AUTOMATICAMENTE'; n.classList.add('show'); saveTimer=setTimeout(()=>n.classList.remove('show'),1200)}
document.getElementById('saveData').addEventListener('click',async()=>{localStorage.setItem(STORAGE,JSON.stringify(states));await saveCloud(false)});

async function loadCloud(){
  try{
    const res=await fetch('/.netlify/functions/data',{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const obj=await res.json();
    if(obj && obj.states && typeof obj.states==='object' && Object.keys(obj.states).length){
      states=obj.states;
      localStorage.setItem(STORAGE,JSON.stringify(states));
      render('✓ DADOS CARREGADOS DO NETLIFY');
    }else if(Object.keys(states).length){
      await saveCloud(true);
      render('✓ DADOS LOCAIS ENVIADOS AO NETLIFY');
    }
  }catch(e){
    console.error(e);
    renderNotice('⚠ MODO LOCAL: não foi possível carregar os dados do Netlify');
  }
}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportData(){
 save();
 const rows=[['Torre','Pavimento','Área','Apartamento','Etapa','Atividade','Status','ID FVS','Pendência']];
 Object.keys(states).sort().forEach(k=>{
  const s=states[k]||{},p=k.split('|'),isHall=p[0]==='hall';
  let tw,fl,ap,areaName,T;
  if(isHall){tw=p[1]||'';fl=p[2]||'';ap='';areaName='Hall / Área Comum';T=HALL}
  else{tw=p[0]||'';fl=p[1]||'';ap=p[2]||'';areaName='Apartamento';T=APT}
  T.forEach(t=>{
   const hasData=(s.done&&s.done[t[0]])||(s.force&&s.force[t[0]])||(s.fvs&&s.fvs[t[0]])||(s.pending&&s.pending[t[0]]);
   if(!hasData)return;
   let st='BLOQUEADO';
   if(s.done&&s.done[t[0]])st='FINALIZADO';
   else if(s.force&&s.force[t[0]])st='QUEBRA DE FLUXO';
   else if(t[3].every(x=>(s.done&&s.done[x])||(s.force&&s.force[x])))st='LIBERADO';
   rows.push([tw,fl,areaName,ap,t[1],t[2],st,(s.fvs&&s.fvs[t[0]])||'',(s.pending&&s.pending[t[0]])||'']);
  });
 });
 if(rows.length===1){renderNotice('AINDA NÃO HÁ DADOS PREENCHIDOS PARA EXPORTAR.');return}
 const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 const d=new Date(),pad=n=>String(n).padStart(2,'0');
 a.href=url;a.download='360pv_dados_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.csv';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 renderNotice('✓ CSV EXPORTADO COM SUCESSO');
}
function importData(file){const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result),incoming=(obj&&obj.states&&typeof obj.states==='object')?obj.states:obj;if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw new Error('Formato inválido');if(!confirm('Importar este arquivo substituirá os dados atualmente salvos neste navegador. Deseja continuar?'))return;states=incoming;localStorage.setItem(STORAGE,JSON.stringify(states));scheduleCloudSave();render('✓ DADOS IMPORTADOS COM SUCESSO')}catch(e){renderNotice('ARQUIVO INVÁLIDO. Selecione um arquivo exportado por este programa.')}finally{document.getElementById('importFile').value=''}};r.readAsText(file,'utf-8')}
document.getElementById('exportData').addEventListener('click',exportData);document.getElementById('importData').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)importData(f)});
function tasks(){return area.value==='hall'?HALL:APT}
function loadA(){const n=counts[tower.value],old=apt.value;apt.innerHTML='';for(let i=1;i<=n;i++){const o=document.createElement('option');o.value=i;o.textContent='Apto '+String(i).padStart(2,'0');apt.appendChild(o)}if(old&&+old<=n)apt.value=old;render()}
function key(){return area.value==='hall'?'hall|'+tower.value+'|'+floor.value:tower.value+'|'+floor.value+'|'+apt.value}
function S(){const s=states[key()]||(states[key()]={done:{},force:{},fvs:{},pending:{}});s.done=s.done||{};s.force=s.force||{};s.fvs=s.fvs||{};s.pending=s.pending||{};return s}
function status(t,s){if(s.done[t[0]])return'fin';if(s.force[t[0]])return'force';return t[3].every(x=>s.done[x]||s.force[x])?'lib':'bloq'}
function renderNotice(msg){const n=document.getElementById('notice');n.textContent=msg;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),3500)}
function notify(msg){const n=document.getElementById('notice');n.textContent=msg;n.classList.toggle('show',!!msg)}
function render(msg=''){const T=tasks(),s=S(),box=document.getElementById('list');box.innerHTML='';aptLabel.style.display=area.value==='hall'?'none':'block';let phase='';T.forEach(t=>{const z=status(t,s);if(phase!==t[1]){phase=t[1];const h=document.createElement('div');h.className='phase';h.textContent=phase;box.appendChild(h)}const missing=t[3].filter(x=>!s.done[x]&&!s.force[x]).map(id=>T.find(q=>q[0]===id)[2]);const d=document.createElement('div');d.className='task '+z;const row=document.createElement('div');row.className='row';const content=document.createElement('div');content.className='content';const badge=document.createElement('span');badge.className='badge';badge.textContent=z==='fin'?'FINALIZADO':z==='lib'?'LIBERADO':z==='force'?'QUEBRA DE FLUXO':'BLOQUEADO';const nm=document.createElement('div');nm.className='name';nm.textContent=t[2];const dep=document.createElement('div');dep.className='dep';dep.textContent=z==='bloq'?'Aguardando: '+missing.join(' • '):z==='force'?'Liberado manualmente — quebra de fluxo':z==='lib'?'Liberado para execução':'Atividade concluída';content.append(badge,nm,dep);row.appendChild(content);const right=document.createElement('div');right.className='right';
if(z!=='bloq'){const fw=document.createElement('label');fw.className='fvsbox';const fl=document.createElement('span');fl.className='fvslab';fl.textContent='ID FVS';const inp=document.createElement('input');inp.className='fvs';inp.type='text';inp.inputMode='numeric';inp.maxLength=5;inp.placeholder='00000';inp.value=s.fvs[t[0]]||'';inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,5);s.fvs[t[0]]=inp.value;save()});fw.append(fl,inp);right.appendChild(fw);const f=document.createElement('button');f.className='final';f.type='button';f.textContent=z==='fin'?'REABRIR':'FINALIZAR';f.addEventListener('click',()=>{if(z==='fin'){delete s.done[t[0]];save();render();return}const id=(s.fvs[t[0]]||'').trim();if(!id){inp.focus();inp.style.border='2px solid #dc2626';renderNotice('DIGITE O ID DA FVS antes de finalizar: '+t[2]);return}s.done[t[0]]=true;delete s.force[t[0]];save();render()});right.appendChild(f)}
if(z==='bloq'||z==='force'){const q=document.createElement('button');q.className='qf';q.type='button';q.title=z==='bloq'?'Liberação forçada / Quebra de Fluxo':'Cancelar Quebra de Fluxo';q.textContent=z==='bloq'?'⚠':'×';q.addEventListener('click',()=>{if(z==='force'){delete s.force[t[0]];save();render()}else{s.force[t[0]]=true;save();render('QUEBRA DE FLUXO — '+t[2]+' liberada manualmente.')}});right.appendChild(q)}
row.appendChild(right);d.appendChild(row);const pend=document.createElement('label');pend.className='pending';const pl=document.createElement('span');pl.className='pending-label';pl.textContent='PENDÊNCIA';const pi=document.createElement('textarea');pi.className='pending-input';pi.rows=1;pi.maxLength=250;pi.placeholder='Pendência / observação';pi.value=s.pending[t[0]]||'';pi.addEventListener('input',()=>{s.pending[t[0]]=pi.value;save()});pend.append(pl,pi);d.append(row,pend);box.appendChild(d)});document.getElementById('summary').textContent=area.value==='hall'?'H — Hall / Área Comum · Torre '+tower.value+' · '+floor.value+' · Hall, shafts, escada e circulação':'Apartamento · Torre '+tower.value+' · '+floor.value+' · Apto '+String(apt.value).padStart(2,'0');notify(msg)}
area.addEventListener('change',()=>render());tower.addEventListener('change',loadA);floor.addEventListener('change',()=>render());apt.addEventListener('change',()=>render());loadA();loadCloud();
</script>
</body></html>
